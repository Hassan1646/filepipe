- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Start Docker and start it on every boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let ec2-user run docker commands
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true